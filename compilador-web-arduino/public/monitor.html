<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Serial Web</title>
    <style>
        :root { --bg-main: #181824; --bg-toolbar: #232334; --border-color: #3f3f5a; --text-main: #edf2f4; --text-terminal: #a8e6cf; --accent-color: #bae1ff; --danger-color: #ff9aa2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background-color: var(--bg-toolbar); padding: 10px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--border-color); flex-wrap: wrap; }
        .btn { background-color: var(--border-color); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn:hover { background-color: #4e4e6f; }
        .btn:active { transform: scale(0.96); }
        .btn-connect { background-color: var(--accent-color); color: #1a1a24; }
        .btn-connect:hover { background-color: #a3ccee; }
        .btn-disconnect { background-color: var(--danger-color); color: #1a1a24; }
        .btn-disconnect:hover { background-color: #e58a92; }
        .control-group { display: flex; align-items: center; gap: 8px; background-color: rgba(0, 0, 0, 0.2); padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        select { background-color: transparent; color: var(--text-main); border: none; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
        select option { background-color: var(--bg-toolbar); }
        .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin-left: auto; }
        .terminal-container { flex-grow: 1; background-color: var(--bg-main); padding: 15px; overflow-y: auto; position: relative; }
        #terminal { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; line-height: 1.5; color: var(--text-terminal); white-space: pre-wrap; word-wrap: break-word; padding-bottom: 20px; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; border: 3px solid var(--bg-main); }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }
        .input-bar { background-color: var(--bg-toolbar); padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-top: 2px solid var(--border-color); }
        .input-wrapper { flex-grow: 1; display: flex; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; transition: border-color 0.3s; }
        .input-wrapper:focus-within { border-color: var(--accent-color); }
        #cmdInput { flex-grow: 1; background-color: transparent; border: none; color: var(--text-main); padding: 10px 15px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 14px; outline: none; }
        #cmdInput::placeholder { color: #555577; }
        .btn-send { background-color: var(--text-terminal); color: #1a1a24; border-radius: 0 5px 5px 0; }
        .btn-send:hover { background-color: #8fceb5; }
    </style>
</head>
<body>
    <header class="toolbar">
        <button id="btnConnect" class="btn btn-connect">Conectar Placa</button>
        <div class="control-group">
            <label for="baudRate" style="font-size: 12px; color: #888;">Baudios:</label>
            <select id="baudRate">
                <option value="9600">9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
                <option value="57600">57600</option>
                <option value="115200" selected>115200</option>
                <option value="230400">230400</option>
            </select>
        </div>
        <button id="btnClear" class="btn">Limpiar</button>
        <label class="checkbox-group">
            <input type="checkbox" id="autoScroll" checked>
            Desplazamiento automático
        </label>
    </header>

    <main class="terminal-container" id="terminalContainer">
        <div id="terminal"></div>
    </main>

    <footer class="input-bar">
        <div class="control-group">
            <select id="lineEnding">
                <option value="none">Sin ajuste de línea</option>
                <option value="nl" selected>Nueva línea (NL)</option>
                <option value="cr">Retorno de carro (CR)</option>
                <option value="both">Ambos (NL & CR)</option>
            </select>
        </div>
        <div class="input-wrapper">
            <input type="text" id="cmdInput" placeholder="Escribe un comando y presiona Enter..." disabled>
            <button id="btnSend" class="btn btn-send" disabled>Enviar ➔</button>
        </div>
    </footer>

    <script>
        const canalSerial = new BroadcastChannel('canal_arduino');

        canalSerial.onmessage = async (mensaje) => {
            if (mensaje.data === 'suelta_el_puerto' && port) {
                logToTerminal('[INFO] Puerto cedido al editor principal.', true);
                await disconnectSerial();
            }
        };

        const btnConnect = document.getElementById('btnConnect');
        const baudRate = document.getElementById('baudRate');
        const btnClear = document.getElementById('btnClear');
        const autoScroll = document.getElementById('autoScroll');
        const terminal = document.getElementById('terminal');
        const terminalContainer = document.getElementById('terminalContainer');
        const cmdInput = document.getElementById('cmdInput');
        const btnSend = document.getElementById('btnSend');
        const lineEnding = document.getElementById('lineEnding');

        let port = null;
        let reader = null;
        let keepReading = false;
        const decoder = new TextDecoder();
        const encoder = new TextEncoder();

        function logToTerminal(msg, isSystem = false) {
            const span = document.createElement('span');
            if (isSystem) {
                span.style.color = '#ff9aa2';
                span.innerHTML = `<i>${msg}</i><br>`;
            } else {
                const cleanText = msg.replace(/[\x00-\x09\x0B-\x0C\x0E-\x1F\x7F-\x9F]/g, '');
                span.innerText = cleanText;
            }
            terminal.appendChild(span);

            if (autoScroll.checked) {
                terminalContainer.scrollTop = terminalContainer.scrollHeight;
            }
        }

        async function readSerialLoop() {
            try {
                while (port && port.readable && keepReading) {
                    reader = port.readable.getReader();
                    try {
                        while (keepReading) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            if (value) {
                                logToTerminal(decoder.decode(value));
                            }
                        }
                    } catch (error) {
                        logToTerminal(`[ERROR]: ${error.message}`, true);
                    } finally {
                        if (reader) {
                            reader.releaseLock();
                            reader = null;
                        }
                    }
                }
            } catch (err) {
                logToTerminal(`[ERROR]: ${err.message}`, true);
            }
        }

        async function connectSerial() {
            try {
                if (!('serial' in navigator)) {
                    alert("Web Serial API no soportada en este navegador.");
                    return;
                }

                canalSerial.postMessage('suelta_el_puerto');
                await new Promise(resolve => setTimeout(resolve, 1000));

                port = await navigator.serial.requestPort();
                const rate = parseInt(baudRate.value, 10);
                
                await port.open({ baudRate: rate });
                
                logToTerminal(`[INFO] Conectado exitosamente (${rate} bps).`, true);
                
                btnConnect.innerHTML = 'Desconectar';
                btnConnect.className = 'btn btn-disconnect';
                cmdInput.disabled = false;
                btnSend.disabled = false;
                cmdInput.focus();

                keepReading = true;
                readSerialLoop();

            } catch (error) {
                logToTerminal(`[INFO] Conexión cancelada.`, true);
            }
        }

        async function disconnectSerial() {
            keepReading = false;
            
            if (reader) {
                try { await reader.cancel(); } catch (e) { console.error(e); }
            }
            if (port) {
                try { await port.close(); } catch (e) { console.error(e); }
                port = null;
            }

            logToTerminal('[INFO] Dispositivo desconectado.', true);
            
            btnConnect.innerHTML = 'Conectar Placa';
            btnConnect.className = 'btn btn-connect';
            cmdInput.disabled = true;
            btnSend.disabled = true;
        }

        async function sendData() {
            if (!port || !port.writable) return;
            
            let data = cmdInput.value;
            const endType = lineEnding.value;

            if (endType === 'nl') data += '\n';
            else if (endType === 'cr') data += '\r';
            else if (endType === 'both') data += '\r\n';

            const writer = port.writable.getWriter();
            try {
                await writer.write(encoder.encode(data));
                cmdInput.value = '';
            } catch (error) {
                logToTerminal(`[ERROR]: ${error.message}`, true);
            } finally {
                writer.releaseLock();
            }
        }

        btnConnect.addEventListener('click', async () => {
            if (port) {
                await disconnectSerial();
            } else {
                await connectSerial();
            }
        });

        baudRate.addEventListener('change', async () => {
            if (port) {
                logToTerminal(`[INFO] Baudios cambiados a ${baudRate.value}. Reconectando...`, true);
                await disconnectSerial();
            }
        });

        btnClear.addEventListener('click', () => {
            terminal.innerHTML = '';
        });

        btnSend.addEventListener('click', sendData);

        cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendData();
            }
        });

        navigator.serial.addEventListener("disconnect", (event) => {
            if (port === event.target) {
                disconnectSerial();
                logToTerminal('[INFO] Dispositivo desconectado físicamente.', true);
            }
        });
    </script>
</body>
</html>
